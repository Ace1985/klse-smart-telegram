name: KLSE Smart V3

on:
  schedule:
    - cron: '15 5 * * 1-5'
    - cron: '50 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4  # 升级至 v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5  # 升级至 v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance

    - name: 执行股票抓取与推送
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python klse_bot.py
