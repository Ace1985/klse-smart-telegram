name: KLSE Smart V3

on:
  schedule:
    - cron: "40 12 * * 1-5"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "15 17 * * 1-5"
      timezone: "Asia/Kuala_Lumpur"
  workflow_dispatch:
    inputs:
      report_mode:
        description: "Report to run"
        required: true
        default: close
        type: choice
        options:
          - lunch
          - close

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select report mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.report_mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 12 * * 1-5" ]; then
            echo "mode=lunch" >> "$GITHUB_OUTPUT"
          else
            echo "mode=close" >> "$GITHUB_OUTPUT"
          fi
      - name: Run KLSE Smart V3
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODE: ${{ steps.mode.outputs.mode }}
        run: python klse_bot.py
