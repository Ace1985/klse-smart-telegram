name: KLSE Smart V3

on:
  schedule:
    # 转换为 UTC 时间（马文 GMT+8 需减去 8 小时）
    # 示例 1: 13:15 GMT+8 (午市开盘) -> UTC 05:15
    - cron: '15 5 * * 1-5'
    # 示例 2: 17:50 GMT+8 (收盘后)   -> UTC 09:50
    - cron: '50 9 * * 1-5'
  workflow_dispatch: # 允许在 GitHub 界面随时手动点击测试运行

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v3

    - name: 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance

    - name: 执行股票抓取与推送
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python klse_bot.py
