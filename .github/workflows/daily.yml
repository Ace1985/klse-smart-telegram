name: KLSE Smart V3

on:
  schedule:
    # 转换为 UTC 时间（马来西亚 GMT+8 需减去 8 小时）
    # 1. 13:15 GMT+8 (午市开盘) -> UTC 05:15
    - cron: '15 5 * * 1-5'
    # 2. 17:50 GMT+8 (收盘后)   -> UTC 09:50
    - cron: '50 9 * * 1-5'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance

    - name: 执行股票抓取与推送
      env:
        TELEGRAM_BOT_TOKEN: "8962341800:AAHh9SLwcEOu-fL8mPehRIwtHo6SL9DBZZ0"
        TELEGRAM_CHAT_ID: "1784673116"
      run: python klse_bot.py
